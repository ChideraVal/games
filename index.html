<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppLixir Rewarded Ad Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .card {
            width: min(90%, 420px);
            padding: 32px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .points {
            font-size: 40px;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 16px;
            min-height: 20px;
            color: #555;
        }

        #applixir-ad-container {
            position: relative;
        }
    </style>
    <script>(function(s){s.dataset.zone='11638329',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>

<body>

    <div class="card">
        <h1>AppLixir Test</h1>

        <p>Watch a rewarded ad to receive 5 points.</p>

        <div class="points">
            <span id="points">0</span> points
        </div>

        <button id="watchBtn">
            Watch Ad → +5 Points
        </button>

        <div id="status"></div>

        <!-- AppLixir ad player anchor -->
        <div id="applixir-ad-container"></div>
    </div>

    <!-- AppLixir v6 SDK -->
    <script src="https://cdn.applixir.com/applixir.app.v6.1.0.js"></script>

    <script>
        const API_KEY = "523f57f6-b1b1-4f3e-8ea9-dbd35209f477";

        let points = 0;

        const watchBtn = document.getElementById("watchBtn");
        const pointsEl = document.getElementById("points");
        const statusEl = document.getElementById("status");

        watchBtn.addEventListener("click", () => {

            watchBtn.disabled = true;
            statusEl.textContent = "Loading ad...";

            initializeAndOpenPlayer({
                apiKey: API_KEY,

                injectionElementId: "applixir-ad-container",

                adStatusCallbackFn: (status) => {
                    console.log("AppLixir status:", status);

                    if (status.type === "complete") {
                        points += 5;
                        pointsEl.textContent = points;

                        statusEl.textContent =
                            "✅ Ad completed! You received 5 points.";

                        watchBtn.disabled = false;
                    }
                },

                adErrorCallbackFn: (error) => {
                    console.error("AppLixir error:", error);

                    statusEl.textContent =
                        "❌ Unable to load the ad.";

                    watchBtn.disabled = false;
                }
            });
        });
    </script>

</body>
</html>
